# Experimental Minecraft 1.20.1 Forge CI. Keep on review/ci-minecraft-qa.
# First run is triggered by committing this file on that branch.
# Do not merge into main until reviewed and explicitly approved.
name: Experimental Minecraft Forge QA

on:
  push:
    branches:
      - review/ci-minecraft-qa

permissions:
  contents: read

jobs:
  forge-regression:
    name: Forge build and 36 GameTests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: forge-port
    steps:
      - name: Check out approved source plus isolated workflow
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Check static foundation
        run: python3 scripts/check_foundation.py

      - name: Build development JAR
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain --max-workers=2

      - name: Run real Minecraft Forge GameTestServer
        run: |
          set -o pipefail
          timeout --signal=TERM 45m ./gradlew runGameTestServer \
            --no-daemon --console=plain --max-workers=2 \
            2>&1 | tee game-test-ci.log
          # Detect partial/no test execution, not merely a zero Gradle exit code.
          grep -Fq 'All 36 required tests passed' game-test-ci.log

      - name: Select one development JAR for the client smoke test
        run: |
          mkdir -p ../ci-dist
          find build/libs -maxdepth 1 -type f -name 'mysticalautomation-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            -exec cp '{}' ../ci-dist/ \;
          test "$(find ../ci-dist -maxdepth 1 -name '*.jar' | wc -l)" -eq 1
          ls -lh ../ci-dist

      - name: Pass the mod JAR to the next job
        uses: actions/upload-artifact@v4
        with:
          name: experimental-mod-jar
          path: ci-dist/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Preserve Forge build and GameTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-test-logs
          path: |
            forge-port/game-test-ci.log
            forge-port/run/logs/*.log
            forge-port/run/crash-reports/*
          if-no-files-found: warn
          retention-days: 7

  forge-client-smoke:
    name: HeadlessMC Forge client smoke (experimental)
    needs: forge-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out project configuration
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Retrieve the JAR built in the first job
        uses: actions/download-artifact@v4
        with:
          name: experimental-mod-jar
          path: ci-dist

      - name: Stage mod and three exact Forge runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/mods
          find ci-dist -maxdepth 1 -type f -name 'mysticalautomation-*.jar' \
            -exec cp '{}' run/mods/ \;
          test "$(find run/mods -maxdepth 1 -name 'mysticalautomation-*.jar' | wc -l)" -eq 1
          properties=forge-port/gradle.properties
          get_version() { awk -F= -v key="$1" '$1 == key {print $2; exit}' "$properties"; }
          stage_maven_mod() {
            local group_path="$1" artifact="$2" version="$3"
            test -n "$version"
            curl --fail --location --silent --show-error --retry 3 \
              "https://maven.blakesmods.com/com/blakebr0/${group_path}/${artifact}/${version}/${artifact}-${version}.jar" \
              --output "run/mods/${artifact}-${version}.jar"
            test -s "run/mods/${artifact}-${version}.jar"
          }
          stage_maven_mod cucumber Cucumber "$(get_version cucumber_version)"
          stage_maven_mod mysticalagriculture MysticalAgriculture "$(get_version mysticalagriculture_version)"
          stage_maven_mod mysticalagradditions MysticalAgradditions "$(get_version mysticalagradditions_version)"
          echo 'Staged testing-only mod jars:'
          ls -lh run/mods

      - name: Launch a real Minecraft 1.20.1 Forge client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: '1.20.1'
          modloader: forge
          regex: '.*forge.*'
          mc-runtime-test: forge
          java: '17'
          xvfb: 'true'
          dummy-assets: 'false'
          cache-mc: github

      - name: Preserve HeadlessMC and Minecraft client diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-client-smoke-logs
          path: |
            run/logs/*.log
            run/crash-reports/*
            HeadlessMC/config.properties
          if-no-files-found: warn
          retention-days: 7
